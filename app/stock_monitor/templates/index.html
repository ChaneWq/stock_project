<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个股监控看板</title>
    <style>
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            margin: 24px;
            color: #333;
        }
        h1 { font-size: 20px; margin: 0 0 12px; }
        .toolbar { margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        button {
            padding: 6px 16px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        button:hover { background: #f5f5f5; }
        .toolbar label { font-size: 13px; display: flex; align-items: center; gap: 4px; }
        .toolbar input[type="number"] { width: 56px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; }
        #status { color: #888; font-size: 13px; min-width: 120px; }
        /* 分类 tab 栏 */
        .tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; border-bottom: 1px solid #e0e0e0; padding-bottom: 0; }
        .tab {
            padding: 6px 16px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            background: #f5f5f5;
            border-radius: 4px 4px 0 0;
            font-size: 13px;
            user-select: none;
        }
        .tab:hover { background: #ececec; }
        .tab.active {
            background: #fff;
            border-color: #e0e0e0;
            border-bottom: 1px solid #fff;
            margin-bottom: -1px;
            font-weight: 600;
            color: #1a73e8;
        }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { border: 1px solid #e0e0e0; padding: 7px 10px; text-align: right; white-space: nowrap; }
        th {
            background: #f7f7f7;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        th:hover { background: #ececec; }
        /* 所有表头预留排序箭头位置（透明占位），避免点击排序时该列变宽、后续列平移 */
        th::after {
            content: "▲";
            display: inline-block;
            width: 1em;
            text-align: center;
            color: transparent;
        }
        th.asc::after { color: #1a73e8; }
        th.desc::after { content: "▼"; color: #1a73e8; }
        td.code, td.name { text-align: left; }
        .num-up { color: #e74c3c; }
        .num-down { color: #27ae60; }
        .muted { color: #bbb; }
        .meta { color: #888; font-size: 12px; margin-top: 10px; }
        .hint { color: #aaa; font-size: 12px; }
        /* 列拖拽样式 */
        th[draggable="true"] { cursor: grab; }
        th.dragging { opacity: 0.4; cursor: grabbing; }
        th.drag-over { background: #d4e8ff !important; }
        .grip { color: #bbb; margin-right: 4px; font-size: 11px; }
        /* 平均值统计行 */
        .avg-row td { background: #f0f7ff; font-weight: 600; }
        .avg-row td.avg-label { color: #1a73e8; text-align: left; }
        /* 历史模式徽标与日期控件 */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            background: #fff3e0;
            color: #e65100;
            font-size: 13px;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
        }
        .hidden { display: none; }
        input[type="date"] {
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>个股监控看板<span id="mode-badge" class="badge hidden"></span></h1>
    <div class="toolbar">
        <button id="refresh-btn">刷新数据</button>
        <input type="date" id="date-input">
        <button id="date-query-btn">查询历史</button>
        <button id="back-realtime-btn" class="hidden">返回实时</button>
        <label><input type="checkbox" id="auto-toggle" checked> 自动刷新</label>
        <label>间隔 <input type="number" id="interval-input" value="5" min="1" max="3600"> 秒</label>
        <label><input type="checkbox" id="avg-toggle"> 显示平均值</label>
        <span id="status"></span>
    </div>
    <div class="tabs" id="category-tabs"></div>
    <table id="stock-table">
        <thead><tr></tr></thead>
        <tbody></tbody>
    </table>
    <div class="meta">
        <div id="updated"></div>
        <div class="hint">提示：点击表头排序；拖拽表头可调整列顺序；选择日期点「查询历史」可查看指定交易日（历史模式暂停自动刷新，点「返回实时」恢复）；点击上方分类切换列表；勾选「显示平均值」查看各列均值</div>
    </div>

    <script>
        // ===== 列定义（顺序可拖拽改变） =====
        const COLUMN_DEFS = [
            { key: 'code',              label: '代码',         type: 'text' },
            { key: 'name',              label: '名称',         type: 'text' },
            { key: 'price_change_pct',  label: '最新股价涨幅',  type: 'num', suffix: '%', pct: true },
            { key: 'vr_930',            label: '9:30分量比',    type: 'num' },
            { key: 'vr_latest',         label: '最新量比',      type: 'num' },
            { key: 'change_930_pct',    label: '9:30分涨幅',    type: 'num', suffix: '%', pct: true },
            { key: 'change_931_pct',    label: '9:31分涨幅',    type: 'num', suffix: '%', pct: true },
            { key: 'ma7',               label: 'ma7股价',       type: 'num' },
            { key: 'latest_price',      label: '最新价格',      type: 'num' },
            { key: 'dev_ma7_pct',       label: '距离ma7%',      type: 'num', suffix: '%', pct: true },
            { key: 'remark',            label: '备注',           type: 'text' },
        ];
        let columns = COLUMN_DEFS.slice();

        // ===== 全部数据 + 分类状态 =====
        let allRows = {{ data | tojson }};
        let currentCategory = '全部';
        let sortKey = null;
        let sortAsc = true;
        let showAvg = false;

        // ===== 自动刷新状态 =====
        let autoOn = true;
        let intervalSec = 5;
        let countdown = intervalSec;
        let timer = null;
        let loading = false;

        // ===== 历史查询状态 =====
        // 服务端渲染注入的初始查询日期（YYYYMMDD 或空串），null 表示实时模式
        const INITIAL_DATE = {{ (query_date or '') | tojson }};
        function toDateDash(s) {
            return s ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}` : null;
        }
        let queryDate = toDateDash(INITIAL_DATE);

        // ===== 分类处理 =====
        const UNCATEGORIZED = '未分类';
        function rowCategory(r) {
            return r.category ? r.category : UNCATEGORIZED;
        }
        function getCategories() {
            const cats = [];
            const seen = new Set();
            allRows.forEach(r => {
                const c = rowCategory(r);
                if (!seen.has(c)) { seen.add(c); cats.push(c); }
            });
            return ['全部', ...cats];
        }
        function getCurrentRows() {
            if (currentCategory === '全部') return allRows;
            return allRows.filter(r => rowCategory(r) === currentCategory);
        }

        // ===== 格式化 =====
        function fmt(v) {
            if (v === null || v === undefined || (typeof v === 'number' && isNaN(v))) {
                return '<span class="muted">-</span>';
            }
            return Number(v).toFixed(2);
        }
        function pctClass(v) {
            if (typeof v !== 'number' || isNaN(v)) return '';
            return v > 0 ? 'num-up' : (v < 0 ? 'num-down' : '');
        }

        // ===== 平均值计算 =====
        function calcAvg(rows, key) {
            const vals = rows.map(r => r[key])
                             .filter(v => typeof v === 'number' && !isNaN(v));
            if (vals.length === 0) return null;
            return vals.reduce((a, b) => a + b, 0) / vals.length;
        }

        // ===== 渲染分类 tab 栏 =====
        function renderTabs() {
            const cats = getCategories();
            const el = document.getElementById('category-tabs');
            el.innerHTML = '';
            cats.forEach(cat => {
                const tab = document.createElement('div');
                tab.className = 'tab' + (cat === currentCategory ? ' active' : '');
                tab.textContent = cat;
                tab.addEventListener('click', () => {
                    if (cat === currentCategory) return;
                    currentCategory = cat;
                    // 切换 tab 重置排序状态
                    sortKey = null;
                    sortAsc = true;
                    renderAll();
                });
                el.appendChild(tab);
            });
        }

        // ===== 渲染表头 =====
        function renderHead() {
            const tr = document.querySelector('#stock-table thead tr');
            tr.innerHTML = '';
            columns.forEach(col => {
                const th = document.createElement('th');
                th.textContent = col.label;
                th.dataset.key = col.key;
                th.dataset.type = col.type;
                th.draggable = true;
                if (sortKey === col.key) th.classList.add(sortAsc ? 'asc' : 'desc');
                tr.appendChild(th);
            });
            bindHeadEvents();
        }

        // ===== 渲染数据行（含可选平均值行） =====
        function renderRows(rows, avgRows) {
            const tbody = document.querySelector('#stock-table tbody');
            tbody.innerHTML = '';
            // 平均值统计行（开关打开时显示在表格最上方）
            if (showAvg) {
                const avgTr = document.createElement('tr');
                avgTr.className = 'avg-row';
                let html = '';
                columns.forEach((col, idx) => {
                    if (col.type === 'num') {
                        const avg = calcAvg(avgRows, col.key);
                        const cls = col.pct ? pctClass(avg) : '';
                        const suffix = col.suffix || '';
                        html += `<td class="${cls}">${fmt(avg)}${suffix}</td>`;
                    } else {
                        html += `<td class="avg-label">${idx === 0 ? '平均值' : '—'}</td>`;
                    }
                });
                avgTr.innerHTML = html;
                tbody.appendChild(avgTr);
            }
            rows.forEach(r => {
                const tr = document.createElement('tr');
                let html = '';
                columns.forEach(col => {
                    const v = r[col.key];
                    if (col.type === 'text') {
                        html += `<td class="${col.key}">${v ?? ''}</td>`;
                    } else {
                        const cls = col.pct ? pctClass(v) : '';
                        const suffix = col.suffix || '';
                        html += `<td class="${cls}">${fmt(v)}${suffix}</td>`;
                    }
                });
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function renderAll() {
            renderTabs();
            renderHead();
            const currentData = getCurrentRows();
            let rows = currentData;
            if (sortKey) {
                const col = columns.find(c => c.key === sortKey);
                if (col) rows = sortRows(currentData, sortKey, col.type, sortAsc);
            }
            renderRows(rows, currentData);
        }

        // ===== 排序 =====
        function sortRows(rows, key, type, asc) {
            const arr = rows.slice();
            arr.sort((a, b) => {
                let va = a[key], vb = b[key];
                if (type === 'num') {
                    const na = (typeof va === 'number' && !isNaN(va)) ? va : Number.NEGATIVE_INFINITY;
                    const nb = (typeof vb === 'number' && !isNaN(vb)) ? vb : Number.NEGATIVE_INFINITY;
                    return asc ? na - nb : nb - na;
                } else {
                    va = (va === null || va === undefined) ? '' : String(va);
                    vb = (vb === null || vb === undefined) ? '' : String(vb);
                    return asc ? va.localeCompare(vb, 'zh') : vb.localeCompare(va, 'zh');
                }
            });
            return arr;
        }
        function applySort(key, type) {
            if (sortKey === key) {
                sortAsc = !sortAsc;
            } else {
                sortKey = key;
                sortAsc = true;
            }
            renderAll();
        }

        // ===== 表头事件：点击排序 + 拖拽换列 =====
        let dragKey = null;
        function bindHeadEvents() {
            document.querySelectorAll('#stock-table th').forEach(th => {
                th.addEventListener('click', () => {
                    if (dragKey !== null) return;
                    const key = th.dataset.key;
                    const type = th.dataset.type;
                    if (key) applySort(key, type);
                });
                th.addEventListener('dragstart', e => {
                    dragKey = th.dataset.key;
                    th.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', dragKey);
                });
                th.addEventListener('dragend', () => {
                    th.classList.remove('dragging');
                    document.querySelectorAll('#stock-table th').forEach(t => t.classList.remove('drag-over'));
                    setTimeout(() => { dragKey = null; }, 0);
                });
                th.addEventListener('dragover', e => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    if (th.dataset.key !== dragKey) th.classList.add('drag-over');
                });
                th.addEventListener('dragleave', () => {
                    th.classList.remove('drag-over');
                });
                th.addEventListener('drop', e => {
                    e.preventDefault();
                    th.classList.remove('drag-over');
                    const targetKey = th.dataset.key;
                    if (dragKey && targetKey && dragKey !== targetKey) {
                        reorderColumns(dragKey, targetKey);
                    }
                });
            });
        }

        function reorderColumns(draggedKey, targetKey) {
            const arr = columns.slice();
            const fromIdx = arr.findIndex(c => c.key === draggedKey);
            if (fromIdx < 0) return;
            const item = arr.splice(fromIdx, 1)[0];
            const toIdx = arr.findIndex(c => c.key === targetKey);
            arr.splice(toIdx, 0, item);
            columns = arr;
            renderAll();
        }

        // ===== 数据刷新 =====
        async function refreshData() {
            loading = true;
            updateStatus();
            try {
                const url = queryDate
                    ? '/api/data?date=' + encodeURIComponent(queryDate)
                    : '/api/data';
                const resp = await fetch(url);
                const data = await resp.json();
                allRows = data;
                // 刷新后保持当前 tab，重新渲染（排序状态保留）
                renderTabs();
                const currentData = getCurrentRows();
                let rows = currentData;
                if (sortKey) {
                    const col = columns.find(c => c.key === sortKey);
                    if (col) rows = sortRows(currentData, sortKey, col.type, sortAsc);
                }
                renderRows(rows, currentData);
                setUpdated();
            } catch (e) {
                document.getElementById('status').textContent = '刷新失败：' + e.message;
            } finally {
                loading = false;
                countdown = intervalSec;
                updateStatus();
            }
        }

        // ===== 自动刷新控制 =====
        function startAuto() {
            if (timer) return;
            autoOn = true;
            countdown = intervalSec;
            timer = setInterval(() => {
                // 历史模式数据不变，不自动刷新
                if (loading || queryDate) return;
                countdown--;
                if (countdown <= 0) {
                    refreshData();
                } else {
                    updateStatus();
                }
            }, 1000);
            updateStatus();
        }
        function stopAuto() {
            autoOn = false;
            if (timer) { clearInterval(timer); timer = null; }
            updateStatus();
        }
        function updateStatus() {
            const el = document.getElementById('status');
            if (loading) {
                el.textContent = '加载中...';
            } else if (queryDate) {
                el.textContent = `历史模式：${queryDate}（不自动刷新）`;
            } else if (autoOn) {
                el.textContent = `下次刷新：${countdown}s`;
            } else {
                el.textContent = '已暂停';
            }
        }

        // ===== 历史模式 UI 状态 =====
        function updateModeUI() {
            const badge = document.getElementById('mode-badge');
            const backBtn = document.getElementById('back-realtime-btn');
            const dateInput = document.getElementById('date-input');
            if (queryDate) {
                badge.textContent = '历史：' + queryDate;
                badge.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                if (!dateInput.value) dateInput.value = queryDate;
            } else {
                badge.classList.add('hidden');
                backBtn.classList.add('hidden');
            }
            updateStatus();
        }

        function setUpdated() {
            document.getElementById('updated').textContent =
                '最近更新：' + new Date().toLocaleString('zh-CN');
        }

        // ===== 工具栏事件 =====
        document.getElementById('refresh-btn').addEventListener('click', () => {
            refreshData();
        });
        // 查询历史日期（输入为空则回到实时）
        document.getElementById('date-query-btn').addEventListener('click', () => {
            const v = document.getElementById('date-input').value;
            queryDate = v || null;
            updateModeUI();
            refreshData();
        });
        // 返回实时模式
        document.getElementById('back-realtime-btn').addEventListener('click', () => {
            queryDate = null;
            document.getElementById('date-input').value = '';
            updateModeUI();
            refreshData();
        });
        document.getElementById('auto-toggle').addEventListener('change', e => {
            if (e.target.checked) startAuto(); else stopAuto();
        });
        document.getElementById('interval-input').addEventListener('change', e => {
            let v = parseInt(e.target.value, 10);
            if (isNaN(v) || v < 1) v = 1;
            intervalSec = v;
            e.target.value = v;
            countdown = intervalSec;
            updateStatus();
        });
        document.getElementById('avg-toggle').addEventListener('change', e => {
            showAvg = e.target.checked;
            renderAll();
        });

        // ===== 初始化 =====
        (function initDateMode() {
            const dateInput = document.getElementById('date-input');
            const now = new Date();
            const pad = n => String(n).padStart(2, '0');
            // 日期选择上限 = 今天
            dateInput.max = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
            if (queryDate) dateInput.value = queryDate;
            updateModeUI();
        })();
        renderAll();
        setUpdated();
        startAuto();
    </script>
</body>
</html>
