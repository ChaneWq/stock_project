<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个股数据查询</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; padding: 24px; }
    .panel { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px;
             box-shadow: 0 1px 4px rgba(0,0,0,.08); max-width: 1200px; }
    h1 { font-size: 20px; margin-bottom: 16px; color: #333; }
    .form-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    label { font-size: 14px; color: #555; }
    input[type=text], input[type=date], input[type=number] {
        padding: 6px 10px; border: 1px solid #d0d3da; border-radius: 4px; font-size: 14px; }
    input[type=number] { width: 80px; }
    .mode-desc { font-size: 12px; color: #999; }
    button { padding: 7px 22px; background: #3498db; color: #fff; border: none;
             border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:hover { background: #2980b9; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid #e8e8e8; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #f0f2f5; color: #333; font-weight: 600; }
    tr:hover td { background: #f8f9fb; }
    .up { color: #e74c3c; }
    .down { color: #27ae60; }
    .empty { color: #999; padding: 30px; text-align: center; }
    .error { color: #e74c3c; padding: 12px; }
    .hint { font-size: 12px; color: #999; margin-left: 10px; }
</style>
</head>
<body>
<div class="panel">
    <h1>个股数据查询</h1>
    <div class="form-row" style="margin-bottom:12px;">
        <label>代码 <input type="text" id="code" placeholder="如 000712" size="10"></label>
        <label><input type="radio" name="mode" value="range" checked> 日期区间</label>
        <label><input type="radio" name="mode" value="recent"> 最近N个交易日</label>
    </div>
    <div class="form-row" id="row_range">
        <label>开始 <input type="date" id="start"></label>
        <label>结束 <input type="date" id="end"></label>
        <span class="mode-desc">留空开始=不限，留空结束=今天</span>
    </div>
    <div class="form-row" id="row_recent" style="display:none;">
        <label>N <input type="number" id="recent" value="30" min="1" max="500"></label>
        <span class="mode-desc">按该股实际交易日取最近N天</span>
    </div>
    <div class="form-row" style="margin-top:14px;">
        <button onclick="doQuery()">查 询</button>
        <span class="hint" id="hint"></span>
    </div>
</div>

<div class="panel">
    <table>
        <thead>
            <tr>
                <th>日期</th><th>涨幅%</th><th>成交量</th><th>量变化%</th>
                <th>MA7</th><th>偏离度%</th>
                <th>9:30量比</th><th>9:30涨幅%</th>
                <th>9:31量比</th><th>9:31涨幅%</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <tr><td colspan="10" class="empty">输入代码后点击查询</td></tr>
        </tbody>
    </table>
</div>

<script>
function fmt(v, digits, suffix) {
    if (v === null || v === undefined) return '-';
    return Number(v).toFixed(digits) + (suffix || '');
}
function colorTd(v, digits) {
    if (v === null || v === undefined) return '<td>-</td>';
    var cls = v > 0 ? 'up' : (v < 0 ? 'down' : '');
    return '<td class="' + cls + '">' + fmt(v, digits) + '</td>';
}
function doQuery() {
    var code = document.getElementById('code').value.trim();
    var hint = document.getElementById('hint');
    if (!code) { hint.textContent = '请输入股票代码'; return; }
    hint.textContent = '查询中...';
    var mode = document.querySelector('input[name=mode]:checked').value;
    var url = '/api/query?code=' + encodeURIComponent(code);
    if (mode === 'recent') {
        url += '&recent=' + (document.getElementById('recent').value || 30);
    } else {
        var s = document.getElementById('start').value;
        var e = document.getElementById('end').value;
        if (s) url += '&start=' + s;
        if (e) url += '&end=' + e;
    }
    fetch(url).then(function(r) { return r.json(); }).then(function(resp) {
        if (resp.error) {
            hint.textContent = '';
            document.getElementById('tbody').innerHTML =
                '<tr><td colspan="10" class="error">' + resp.error + '</td></tr>';
            return;
        }
        hint.textContent = '共 ' + resp.count + ' 条';
        var rows = resp.data.map(function(d) {
            return '<tr>'
                + '<td>' + d.trade_date + '</td>'
                + colorTd(d.today_rate, 2)
                + '<td>' + (d.vol === null ? '-' : d.vol.toLocaleString()) + '</td>'
                + colorTd(d.vol_chg_pct, 2)
                + '<td>' + fmt(d.MA7, 3) + '</td>'
                + colorTd(d.dev_pct, 2)
                + '<td>' + fmt(d.vol_ratio_0930, 3) + '</td>'
                + colorTd(d.rate_0930, 2)
                + '<td>' + fmt(d.vol_ratio_0931, 3) + '</td>'
                + colorTd(d.rate_0931, 2)
                + '</tr>';
        }).join('');
        document.getElementById('tbody').innerHTML = rows;
    }).catch(function(err) {
        hint.textContent = '';
        document.getElementById('tbody').innerHTML =
            '<tr><td colspan="10" class="error">请求失败：' + err + '</td></tr>';
    });
}
document.querySelectorAll('input[name=mode]').forEach(function(r) {
    r.addEventListener('change', function() {
        var isRange = r.value === 'range';
        document.getElementById('row_range').style.display = isRange ? '' : 'none';
        document.getElementById('row_recent').style.display = isRange ? 'none' : '';
    });
});
document.getElementById('code').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doQuery();
});
</script>
</body>
</html>
