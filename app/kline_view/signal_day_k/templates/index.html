<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信号日K线回看</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; padding: 16px; color: #333; }
h1 { font-size: 20px; margin-bottom: 14px; }
.panel { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.form-item { display: flex; align-items: center; gap: 6px; }
.form-item label { font-size: 13px; white-space: nowrap; }
select { padding: 6px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; min-width: 200px; }
button { padding: 7px 16px; background: #409eff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
button:disabled { background: #a0cfff; cursor: not-allowed; }
.tip { font-size: 12px; color: #909399; }
#chart { width: 100%; height: 640px; background: #1e1e1e; border-radius: 4px; }
.chart-wrap { position: relative; }
/* 左上角固定数据面板：随十字光标刷新内容，位置固定，不遮挡交互（深色底适配白色指标标签） */
.info-panel { position: absolute; top: 6px; left: 66px; z-index: 10; pointer-events: none;
  background: rgba(24,24,24,.55); border: 1px solid rgba(68,68,68,.6); border-radius: 6px;
  padding: 5px 12px; font-size: 12px; line-height: 1.8; color: #ccc; }
.up { color: #e64545; }
.down { color: #1dbf74; }
.ma7 { color: #e64545; }
.vol_pct { color: #4dd0e1; }
.ma7_slope { color: #b39ddb; }
.bias7 { color: #7ee787; }
.zx_short_term_trend { color: #ffffff; }
.zx_bull_bear_line { color: #ffd700; }
.sig-tag { background: #f5a623; color: #fff; border-radius: 3px; padding: 0 6px; }
.sig-tag-other { background: #c0c4cc; color: #fff; border-radius: 3px; padding: 0 6px; }
.note { margin-top: 8px; font-size: 13px; color: #b8860b; min-height: 0; }
.msg { margin-top: 8px; font-size: 13px; color: #e64545; min-height: 18px; }
</style>
</head>
<body>

<h1>信号日K线回看（前200 / 后20 交易日）</h1>
<div class="panel">
  <div class="form-row">
    <div class="form-item">
      <label>信号</label>
      <select id="signal"></select>
    </div>
    <button id="prev">上一个</button>
    <div class="form-item">
      <label>第</label>
      <input type="number" id="posNum" min="1" style="width:60px">
      <label id="posTotal">/ -</label>
    </div>
    <button id="next">下一个</button>
    <button id="btn">查询</button>
    <div class="form-item">
      <label>展示</label>
      <input type="number" id="viewBefore" value="200" min="0" max="200" style="width:66px">
      <label>前 /</label>
      <input type="number" id="viewAfter" value="20" min="0" max="20" style="width:66px">
      <label>后</label>
    </div>
    <span class="tip">信号日：金色竖线+蜡烛金边；展示窗口可设前 n/后 n（修改即时生效），拖动滑块可看全部数据</span>
    <div class="form-item">
      <label for="hotkeyOn">快捷键</label>
      <input type="checkbox" id="hotkeyOn" checked style="accent-color:#f5a623">
    </div>
    <div class="form-item">
      <label for="vLineOn">信号日线</label>
      <input type="checkbox" id="vLineOn" checked style="accent-color:#f5a623">
    </div>
    <div class="form-item">
      <label for="hLineOn">收盘价线</label>
      <input type="checkbox" id="hLineOn" checked style="accent-color:#f5a623">
    </div>
  </div>
  <div class="note" id="note"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="panel">
  <div class="chart-wrap">
    <div id="chart"></div>
    <div class="info-panel" id="infoPanel">加载中...</div>
  </div>
</div>

<script>
const chart = echarts.init(document.getElementById('chart'));
const infoPanel = document.getElementById('infoPanel');
const msg = document.getElementById('msg');
const noteEl = document.getElementById('note');
const sel = document.getElementById('signal');
const UP = '#e64545', DOWN = '#1dbf74';   // A股习惯：红涨绿跌
const SIG = '#f5a623';                    // 信号日标注色（金）
let KDATA = null;
let SIGNALS = [];
const PLOT_KEYS = ['ma7', 'zx_short_term_trend', 'zx_bull_bear_line'];  // 主图画线的指标
// 固定面板显示值的指标（不画线）：量涨跌幅=量环比%、MA斜率=MA7较上一交易日环比%、MA7偏离度=BIAS%
const VALUE_KEYS = [...PLOT_KEYS, 'vol_pct', 'ma7_slope', 'bias7'];
const PCT_KEYS = ['vol_pct', 'ma7_slope', 'bias7'];  // 百分比类值，面板显示带 %
const MA_LABEL = {
  ma7: 'MA7',
  zx_short_term_trend: 'ZX短线趋势',
  zx_bull_bear_line: 'ZX牛熊线',
  vol_pct: '量涨跌幅',
  ma7_slope: 'MA斜率',
  bias7: 'MA7偏离度',
};
const MA_STYLE = {
  ma7:  { color: '#e64545', width: 1 },
  zx_short_term_trend: { color: '#ffffff', width: 1.4 },
  zx_bull_bear_line: { color: '#ffd700', width: 1.4 },
};

function fmtVol(v) {
  if (v == null) return '-';
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿';
  if (v >= 1e4) return (v / 1e4).toFixed(1) + '万';
  return v;
}

// 固定数据面板：显示第 i 根K线的数据（十字光标联动）
function showBar(i) {
  const d = KDATA;
  if (!d || i == null || i < 0 || i >= d.count) return;
  const [o, c, l, h] = d.candle[i];
  const prevC = i > 0 ? d.candle[i - 1][1] : d.prev_close;
  const pct = prevC ? (c - prevC) / prevC * 100 : null;
  const cls = c >= prevC ? 'up' : 'down';
  const mas = VALUE_KEYS.map(k =>
    `<span class="${k}">${MA_LABEL[k]} ${d.ma[k][i] ?? '-'}${PCT_KEYS.includes(k) ? '%' : ''}</span>`).join('　');
  const others = d.other_signals || [];
  let tag = '';
  if (i === d.signal_index) tag = '　<span class="sig-tag">信号日</span>';
  else if (others.includes(i)) tag = '　<span class="sig-tag-other">信号</span>';
  infoPanel.innerHTML =
    `<div><b>${d.dates[i]}</b>${tag}　<span class="${cls}">${pct == null ? '-' : (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%'}</span>　开 <span class="${prevC && o >= prevC ? 'up' : 'down'}">${o}</span>　高 ${h}　低 ${l}　收 <span class="${cls}">${c}</span>　量 ${fmtVol(d.volumes[i])}</div>` +
    `<div>${mas}</div>`;
}

async function loadSignals() {
  try {
    const res = await fetch('/api/signals');
    const list = await res.json();
    if (!res.ok || !Array.isArray(list) || !list.length) {
      msg.textContent = (list && list.error) || 'signals.csv 为空或不存在';
      return;
    }
    SIGNALS = list;
    sel.innerHTML = SIGNALS.map((s, i) =>
      `<option value="${i}">${s.code}　${s.trade_date}</option>`).join('');
    document.getElementById('posTotal').textContent = `/ ${SIGNALS.length}`;
    query();
  } catch (e) {
    msg.textContent = '加载信号清单失败：' + e.message;
  }
}

// 全量预热：环形预取清单中所有信号（串行 + 间隔限速防封IP；已预取过的跳过）
const PREFETCH_INTERVAL = 500;   // 每条预取间隔（毫秒），温和限速
const prefetched = new Set();    // 页面生命周期内已预取的信号索引
let prefetching = false;

async function prefetchAll() {
  if (SIGNALS.length < 2 || prefetching) return;
  prefetching = true;
  try {
    for (let step = 1; step < SIGNALS.length; step++) {
      const idx = (Number(sel.value) + step) % SIGNALS.length;
      if (prefetched.has(idx)) continue;
      const s = SIGNALS[idx];
      await fetch(`/api/kline?code=${s.code}&date=${s.trade_date}`).catch(() => {});
      prefetched.add(idx);
      await new Promise(r => setTimeout(r, PREFETCH_INTERVAL));
    }
  } finally {
    prefetching = false;
  }
}

// 序号跳转：输入第 n 个（1 开始），clamp 到 [1, N] 后切换；非法输入回退当前序号
function jumpTo() {
  if (!SIGNALS.length) return;
  const pos = document.getElementById('posNum');
  let n = parseInt(pos.value, 10);
  if (isNaN(n)) { pos.value = String(Number(sel.value) + 1); return; }
  n = Math.max(1, Math.min(SIGNALS.length, n));
  pos.value = String(n);
  sel.value = String(n - 1);
  query();
}

// 序号框与当前信号同步（查询/切换成功后调用）
function syncPos() {
  document.getElementById('posNum').value = String(Number(sel.value) + 1);
}

async function query() {
  const s = SIGNALS[sel.value];
  if (!s) return;
  const btn = document.getElementById('btn');
  msg.textContent = '';
  noteEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '查询中...';
  try {
    const res = await fetch(`/api/kline?code=${s.code}&date=${s.trade_date}`);
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error || '查询失败'; chart.clear(); return; }
    render(data);
    msg.textContent = `${data.code} 共 ${data.count} 个交易日（${data.dates[0]} ~ ${data.dates[data.count-1]}）`;
    if (data.note) noteEl.textContent = '提示：' + data.note;
    syncPos();       // 序号框跟随当前信号
    prefetchAll();   // 当前图渲染完成后，后台串行预热全部信号数据
  } catch (e) {
    msg.textContent = '请求失败：' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '查询';
  }
}

// 展示窗口设置：信号日前 n / 后 n 个交易日（默认 200/20 = 全量展示）
function readViewN() {
  const b = parseInt(document.getElementById('viewBefore').value, 10);
  const a = parseInt(document.getElementById('viewAfter').value, 10);
  return {
    before: (isNaN(b) || b < 0) ? 200 : b,
    after: (isNaN(a) || a < 0) ? 20 : a,
  };
}

// 按设置把展示窗口定位到 信号日前 n ~ 后 n（clamp 到数据范围，修改即时生效无需重新取数）
function applyView() {
  const d = KDATA;
  if (!d) return;
  const { before, after } = readViewN();
  const lo = Math.max(0, d.signal_index - before);
  const hi = Math.min(d.count - 1, d.signal_index + after);
  chart.setOption({
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], startValue: lo, endValue: hi },
      { type: 'slider', xAxisIndex: [0, 1], startValue: lo, endValue: hi },
    ],
  });
}

// 信号日标注竖线（金色 0.77 宽，可开关）：主图金色虚线，同股其它信号日灰色点线（主图/副图共用）
function buildVLines(d) {
  if (!vLineEnabled()) return [];   // 「信号日线」开关关闭时不画竖线
  const mk = (i, color, type, width) => ({
    xAxis: i, label: { show: false }, lineStyle: { color, type, width },
  });
  return [mk(d.signal_index, SIG, 'dashed', 0.77),
    ...(d.other_signals || []).map(i => mk(i, '#c0c4cc', 'dotted', 1))];
}

// 信号日收盘价水平参考线（仅主图）：金色虚线，右端价格标签远离K线防遮挡
function buildHLine(d) {
  const closePrice = d.candle[d.signal_index][1];
  return {
    yAxis: closePrice,
    lineStyle: { color: SIG, type: 'dashed', width: 0.77 },
    label: {
      show: true, position: 'end', formatter: closePrice.toFixed(2),
      color: '#fff', backgroundColor: SIG, padding: [1, 4], borderRadius: 2, fontSize: 11,
    },
  };
}

function hLineEnabled() {
  return document.getElementById('hLineOn').checked;
}

function vLineEnabled() {
  return document.getElementById('vLineOn').checked;
}

// 主图 markLine 数据：竖线 + 开关控制的收盘价水平线
function buildMarkData(d) {
  return hLineEnabled() ? [...buildVLines(d), buildHLine(d)] : buildVLines(d);
}

function render(d) {
  KDATA = d;
  const sig = d.signal_index;

  // 信号日蜡烛金色描边；其余维持红涨绿跌
  const candleData = d.candle.map((arr, i) => i === sig
    ? { value: arr, itemStyle: { borderColor: SIG, borderColor0: SIG, borderWidth: 2 } }
    : arr);

  // 成交量按当日涨跌着色，信号日柱体同步金色高亮
  const volData = d.volumes.map((v, i) => ({
    value: v,
    itemStyle: i === sig
      ? { color: SIG, opacity: .9 }
      : { color: d.candle[i][1] >= d.candle[i][0] ? UP : DOWN, opacity: .85 },
  }));

  chart.setOption({
    animation: false,
    axisPointer: { link: [{ xAxisIndex: 'all' }], label: { backgroundColor: '#555' } },
    // 悬浮框透明空内容：仅保留十字光标与事件驱动固定面板
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      borderWidth: 0, padding: 0, backgroundColor: 'transparent',
      formatter: () => '',
    },
    legend: {
      top: 0,
      textStyle: { color: '#ccc' },
      data: ['K线', ...PLOT_KEYS.map(k => MA_LABEL[k])],
    },
    grid: [
      { left: 60, right: 60, top: 34, height: '58%' },
      { left: 60, right: 60, top: '74%', height: '14%' },
    ],
    xAxis: [
      { type: 'category', data: d.dates, gridIndex: 0, boundaryGap: true,
        axisLine: { lineStyle: { color: '#555' } }, axisLabel: { show: false }, axisTick: { show: false },
        axisPointer: { show: true, label: { show: false } } },
      { type: 'category', data: d.dates, gridIndex: 1, boundaryGap: true,
        axisLine: { lineStyle: { color: '#555' } }, axisLabel: { color: '#aaa' },
        axisPointer: { show: true, label: { show: false } } },
    ],
    yAxis: [
      { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: '#333' } },
        axisLabel: { color: '#aaa' },
        axisPointer: { show: true, label: { show: true } } },
      { gridIndex: 1, axisLabel: { color: '#aaa', formatter: v => fmtVol(v) }, splitLine: { show: false },
        axisPointer: { show: false } },
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
      { type: 'slider', xAxisIndex: [0, 1], top: '93%', height: 18, start: 0, end: 100 },
    ],
    series: [
      {
        name: 'K线', id: 'kline', type: 'candlestick', data: candleData, xAxisIndex: 0, yAxisIndex: 0,
        itemStyle: { color: UP, color0: DOWN, borderColor: UP, borderColor0: DOWN },
        markLine: { symbol: 'none', silent: true, data: buildMarkData(d) },
      },
      ...PLOT_KEYS.map(k => ({
        name: MA_LABEL[k], type: 'line', data: d.ma[k], xAxisIndex: 0, yAxisIndex: 0,
        symbol: 'none', smooth: true,
        lineStyle: { color: MA_STYLE[k].color, width: MA_STYLE[k].width },
        emphasis: { disabled: true },
      })),
      {
        name: '成交量', id: 'vol', type: 'bar', data: volData, xAxisIndex: 1, yAxisIndex: 1,
        markLine: { symbol: 'none', silent: true, data: buildVLines(d) },
      },
    ],
  }, true);

  applyView();   // 按展示窗口设置定位（信号日前 n / 后 n）
  showBar(sig);  // 面板默认显示信号日
}

// 十字光标移动 → 刷新固定面板；移出图表 → 回到信号日
chart.on('updateAxisPointer', function (event) {
  const info = event.axesInfo && event.axesInfo[0];
  if (!info) return;
  showBar(Math.round(info.value));
});
chart.getZr().on('globalout', function () {
  if (KDATA) showBar(KDATA.signal_index);
});

sel.addEventListener('change', query);
// 展示窗口前 n/后 n 修改即时重新定位（不重新取数）
document.getElementById('viewBefore').addEventListener('change', applyView);
document.getElementById('viewAfter').addEventListener('change', applyView);
// 信号日线/收盘价线开关：按 series id 定向更新主图与副图 markLine，不重渲染、不重置缩放
function updateMarkLines() {
  const d = KDATA;
  if (!d) return;
  chart.setOption({
    series: [
      { id: 'kline', markLine: { symbol: 'none', silent: true, data: buildMarkData(d) } },
      { id: 'vol', markLine: { symbol: 'none', silent: true, data: buildVLines(d) } },
    ],
  });
}
document.getElementById('hLineOn').addEventListener('change', updateMarkLines);
document.getElementById('vLineOn').addEventListener('change', updateMarkLines);
// 序号跳转：修改/回车即跳到第 n 个信号
const posNum = document.getElementById('posNum');
posNum.addEventListener('change', jumpTo);
posNum.addEventListener('keydown', e => { if (e.key === 'Enter') jumpTo(); });
document.getElementById('btn').addEventListener('click', query);
// 上一个/下一个：按钮点击与键盘快捷键（q/w）共用
function prevSignal() {
  if (!SIGNALS.length) return;
  sel.value = String((Number(sel.value) - 1 + SIGNALS.length) % SIGNALS.length);
  query();
}
function nextSignal() {
  if (!SIGNALS.length) return;
  sel.value = String((Number(sel.value) + 1) % SIGNALS.length);
  query();
}
document.getElementById('prev').addEventListener('click', prevSignal);
document.getElementById('next').addEventListener('click', nextSignal);

// 复制当前信号代码到剪贴板：优先 clipboard API（127.0.0.1 安全上下文免授权），
// 不可用时降级旧式 execCommand，成功后信息区短暂提示
async function copyCode() {
  if (!KDATA) return;
  const code = KDATA.code;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(code);
      ok = true;
    } else {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch (e) {
    ok = false;
  }
  msg.textContent = ok ? `已复制 ${code} 到剪贴板` : '复制失败';
  setTimeout(() => { if (msg.textContent.includes('剪贴板') || msg.textContent === '复制失败') msg.textContent = ''; }, 2000);
}

// 键盘快捷键：q=上一个 w=下一个 c=复制代码；开关关闭或焦点在输入控件时忽略（避免打字误触发）
function hotkeyEnabled() {
  return document.getElementById('hotkeyOn').checked;
}
document.addEventListener('keydown', e => {
  if (!hotkeyEnabled()) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
  if (e.key === 'q' || e.key === 'Q') prevSignal();
  else if (e.key === 'w' || e.key === 'W') nextSignal();
  else if (e.key === 'c' || e.key === 'C') copyCode();
});

// 页面加载后拉取信号清单并默认查询第一个
loadSignals();
</script>
</body>
</html>
