<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>信号复盘台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f6fa; padding: 16px; color: #333; }
h1 { font-size: 20px; margin-bottom: 14px; }
.panel { background: #fff; border-radius: 8px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.form-item { display: flex; align-items: center; gap: 6px; }
.form-item label { font-size: 13px; white-space: nowrap; }
select { padding: 6px 8px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 13px; min-width: 200px; }
button { padding: 7px 16px; background: #409eff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
button:disabled { background: #a0cfff; cursor: not-allowed; }
.tip { font-size: 12px; color: #909399; }
#chart { width: 100%; height: 640px; background: #1e1e1e; border-radius: 4px; }
.chart-wrap { position: relative; }
/* 左上角固定数据面板：随十字光标刷新内容，位置固定，不遮挡交互（深色底适配白色指标标签） */
.info-panel { position: absolute; top: 6px; left: 66px; z-index: 10; pointer-events: none;
  background: rgba(24,24,24,.55); border: 1px solid rgba(68,68,68,.6); border-radius: 6px;
  padding: 5px 12px; font-size: 12px; line-height: 1.8; color: #ccc; }
.up { color: #e64545; }
.down { color: #1dbf74; }
.ma7 { color: #e64545; }
.vol_pct { color: #4dd0e1; }
.ma7_slope { color: #b39ddb; }
.bias7 { color: #7ee787; }
.zx_short_term_trend { color: #ffffff; }
.zx_bull_bear_line { color: #ffd700; }
.sig-tag { background: #f5a623; color: #fff; border-radius: 3px; padding: 0 6px; }
.sig-tag-other { background: #c0c4cc; color: #fff; border-radius: 3px; padding: 0 6px; }
.note { margin-top: 8px; font-size: 13px; color: #b8860b; min-height: 0; }
.msg { margin-top: 8px; font-size: 13px; color: #e64545; min-height: 18px; }
#group { min-width: 140px; }
#btn { min-width: 88px; }   /* 查询/查询中两态等宽，避免按钮宽度抖动推移后续区块 */
/* 工具栏功能分区：浅灰底圆角区块+左上角标签，书签区独立金色主题，防误按 */
.zone { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; position: relative;
  background: #f8f9fb; border: 1px solid #e4e7ed; border-radius: 8px;
  padding: 13px 14px 11px; margin-top: 6px; }
.zone + .zone { margin-left: 12px; }   /* 区块间距 24px（form-row 12px gap + 12px） */
.zone-tag { position: absolute; top: -9px; left: 10px; font-size: 12px; color: #909399;
  background: #fff; padding: 0 6px; border-radius: 4px; }
.zone-gold { background: #fffaf0; border-color: #f5d89a; }
.zone-gold .zone-tag { color: #b8860b; }
.btn-ghost { background: #fff; color: #409eff; border: 1px solid #409eff; padding: 6px 15px; }
.btn-danger { background: #fff; color: #e64545; border: 1px solid #f3b3b3; padding: 6px 15px; }
.btn-danger:disabled { background: #fff; color: #f3b3b3; border-color: #f3d9d9; }
.btn-gold { background: #f5a623; }
.btn-gold:disabled { background: #f9d9a0; }
.btn-gold-ghost { background: #fff; color: #b8860b; border: 1px solid #f5a623; padding: 6px 15px; }
.btn-gold-ghost:disabled { background: #fff; color: #f0d5a8; border-color: #f0d5a8; }
.bm-info { color: #b8860b; font-weight: bold; }
/* 标记分组浮层：锚定在标记按钮下方，点击外部关闭 */
.tag-wrap { position: relative; }
.tag-pop { display: none; position: absolute; top: calc(100% + 6px); right: 0; z-index: 30;
  background: #fff; border: 1px solid #dcdfe6; border-radius: 6px; padding: 10px 12px; width: 250px;
  box-shadow: 0 2px 10px rgba(0,0,0,.15); text-align: left; }
.tag-pop.show { display: block; }
.tag-pop-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #333; }
.tag-item { display: block; padding: 4px 2px; font-size: 13px; color: #333; cursor: pointer; user-select: none; }
.tag-empty { font-size: 12px; color: #909399; padding: 4px 2px; }
.tag-new { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #dcdfe6;
  color: #409eff; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<h1>信号复盘台</h1>
<div class="panel">
  <div class="form-row">
    <div class="zone">
      <span class="zone-tag">分组管理</span>
      <div class="form-item">
        <label>分组</label>
        <select id="group"></select>
      </div>
      <button id="addGroup" class="btn-ghost">＋建组</button>
      <button id="delGroup" class="btn-danger">删组</button>
      <div class="form-item tag-wrap">
        <button id="tagBtn">标记分组</button>
        <div class="tag-pop" id="tagPop">
          <div class="tag-pop-title" id="tagPopTitle"></div>
          <div id="tagList"></div>
          <a class="tag-new" id="tagNew">＋ 新建分组并标记</a>
        </div>
      </div>
    </div>
    <div class="zone">
      <span class="zone-tag">信号浏览</span>
      <div class="form-item">
        <label>信号</label>
        <select id="signal"></select>
      </div>
      <button id="prev">上一个</button>
      <div class="form-item">
        <label>第</label>
        <input type="number" id="posNum" min="1" style="width:60px">
        <label id="posTotal">/ -</label>
      </div>
      <button id="next">下一个</button>
      <button id="btn">查询</button>
    </div>
    <div class="zone zone-gold">
      <span class="zone-tag">阅读书签</span>
      <button id="bmBtn" class="btn-gold">标记书签</button>
      <button id="bmGo" class="btn-gold-ghost" disabled>跳书签</button>
      <span class="tip bm-info" id="bmInfo"></span>
    </div>
    <div class="zone">
      <span class="zone-tag">展示设置</span>
      <div class="form-item">
        <label>展示</label>
        <input type="number" id="viewBefore" value="200" min="0" max="200" style="width:66px">
        <label>前 /</label>
        <input type="number" id="viewAfter" value="20" min="0" max="20" style="width:66px">
        <label>后</label>
      </div>
      <div class="form-item">
        <label for="hotkeyOn">快捷键</label>
        <input type="checkbox" id="hotkeyOn" checked style="accent-color:#f5a623">
      </div>
      <div class="form-item">
        <label for="vLineOn">信号日线</label>
        <input type="checkbox" id="vLineOn" checked style="accent-color:#f5a623">
      </div>
      <div class="form-item">
        <label for="hLineOn">收盘价线</label>
        <input type="checkbox" id="hLineOn" checked style="accent-color:#f5a623">
      </div>
      <span class="tip">信号日：金色竖线+蜡烛金边；窗口修改即时生效，拖动滑块看全部数据</span>
    </div>
  </div>
  <div class="note" id="note"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="panel">
  <div class="chart-wrap">
    <div id="chart"></div>
    <div class="info-panel" id="infoPanel">加载中...</div>
  </div>
</div>

<script>
const chart = echarts.init(document.getElementById('chart'));
const infoPanel = document.getElementById('infoPanel');
const msg = document.getElementById('msg');
const noteEl = document.getElementById('note');
const sel = document.getElementById('signal');
const UP = '#e64545', DOWN = '#1dbf74';   // A股习惯：红涨绿跌
const SIG = '#f5a623';                    // 信号日标注色（金）
let KDATA = null;
let SIGNALS = [];    // 全量信号（signals.csv 顺序）
let GROUPS = [];     // 用户分组名列表（不含内置"全部"）
let TAGS = {};       // 标记：{"code|date": ["组名", ...]}
let BOOKMARKS = {};  // 分组书签：{分组名: "code|date"}，每组一个阅读进度
let FILTERED = [];   // 当前分组过滤后的信号（下拉/序号/上下键均基于此）
let curGroup = '全部';
const sigKey = s => s.code + '|' + s.trade_date;
const PLOT_KEYS = ['ma7', 'zx_short_term_trend', 'zx_bull_bear_line'];  // 主图画线的指标
// 固定面板显示值的指标（不画线）：量涨跌幅=量环比%、MA斜率=MA7较上一交易日环比%、MA7偏离度=BIAS%
const VALUE_KEYS = [...PLOT_KEYS, 'vol_pct', 'ma7_slope', 'bias7'];
const PCT_KEYS = ['vol_pct', 'ma7_slope', 'bias7'];  // 百分比类值，面板显示带 %
const MA_LABEL = {
  ma7: 'MA7',
  zx_short_term_trend: 'ZX短线趋势',
  zx_bull_bear_line: 'ZX牛熊线',
  vol_pct: '量涨跌幅',
  ma7_slope: 'MA斜率',
  bias7: 'MA7偏离度',
};
const MA_STYLE = {
  ma7:  { color: '#e64545', width: 1 },
  zx_short_term_trend: { color: '#ffffff', width: 1.4 },
  zx_bull_bear_line: { color: '#ffd700', width: 1.4 },
};

function fmtVol(v) {
  if (v == null) return '-';
  if (v >= 1e8) return (v / 1e8).toFixed(2) + '亿';
  if (v >= 1e4) return (v / 1e4).toFixed(1) + '万';
  return v;
}

// 固定数据面板：显示第 i 根K线的数据（十字光标联动）
function showBar(i) {
  const d = KDATA;
  if (!d || i == null || i < 0 || i >= d.count) return;
  const [o, c, l, h] = d.candle[i];
  const prevC = i > 0 ? d.candle[i - 1][1] : d.prev_close;
  const pct = prevC ? (c - prevC) / prevC * 100 : null;
  const cls = c >= prevC ? 'up' : 'down';
  const mas = VALUE_KEYS.map(k =>
    `<span class="${k}">${MA_LABEL[k]} ${d.ma[k][i] ?? '-'}${PCT_KEYS.includes(k) ? '%' : ''}</span>`).join('　');
  const others = d.other_signals || [];
  let tag = '';
  if (i === d.signal_index) tag = '　<span class="sig-tag">信号日</span>';
  else if (others.includes(i)) tag = '　<span class="sig-tag-other">信号</span>';
  infoPanel.innerHTML =
    `<div><b>${d.dates[i]}</b>${tag}　<span class="${cls}">${pct == null ? '-' : (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%'}</span>　开 <span class="${prevC && o >= prevC ? 'up' : 'down'}">${o}</span>　高 ${h}　低 ${l}　收 <span class="${cls}">${c}</span>　量 ${fmtVol(d.volumes[i])}</div>` +
    `<div>${mas}</div>`;
}

// 分组内信号数（"全部"= 清单总数）
function groupCount(name) {
  if (name === '全部') return SIGNALS.length;
  return SIGNALS.filter(s => (TAGS[sigKey(s)] || []).includes(name)).length;
}

// 渲染分组下拉（带数量）；选中"全部"时删组按钮禁用
function renderGroupSel() {
  const g = document.getElementById('group');
  g.innerHTML = ['全部', ...GROUPS].map(n =>
    `<option value="${n}">${n} (${groupCount(n)})</option>`).join('');
  g.value = curGroup;
  document.getElementById('delGroup').disabled = (curGroup === '全部');
}

// 重建信号下拉选项（已标记的附分组名，本组书签附★，便于识别）
function rebuildSignalOptions() {
  const bmKey = BOOKMARKS[curGroup];
  sel.innerHTML = FILTERED.map((s, i) => {
    const gs = TAGS[sigKey(s)] || [];
    const bm = sigKey(s) === bmKey ? '　★' : '';
    return `<option value="${i}">${s.code}　${s.trade_date}${gs.length ? '　[' + gs.join(',') + ']' : ''}${bm}</option>`;
  }).join('');
}

// 应用分组过滤。定位优先级：当前信号仍在组内→保持；
// 不在组内→组内书签的下一条（未读首条，末尾循环，续读）；无书签→第1个
function applyGroupFilter() {
  const prev = FILTERED[Number(sel.value)];
  const curKey = prev ? sigKey(prev) : null;
  FILTERED = curGroup === '全部' ? SIGNALS.slice()
    : SIGNALS.filter(s => (TAGS[sigKey(s)] || []).includes(curGroup));
  rebuildSignalOptions();
  document.getElementById('posTotal').textContent = `/ ${FILTERED.length}`;
  renderBookmarkUI();
  if (!FILTERED.length) {
    msg.textContent = `分组「${curGroup}」暂无信号，请先标记个股`;
    return;
  }
  let i = curKey ? FILTERED.findIndex(s => sigKey(s) === curKey) : -1;
  if (i < 0) {
    const bmKey = BOOKMARKS[curGroup];
    const bi = bmKey ? FILTERED.findIndex(s => sigKey(s) === bmKey) : -1;
    i = bi < 0 ? 0 : (bi + 1) % FILTERED.length;
  }
  sel.value = String(i);
  query();
}

async function loadAll() {
  try {
    const [sigRes, grpRes] = await Promise.all([fetch('/api/signals'), fetch('/api/groups')]);
    const list = await sigRes.json();
    if (!sigRes.ok || !Array.isArray(list) || !list.length) {
      msg.textContent = (list && list.error) || 'signals.csv 为空或不存在';
      return;
    }
    SIGNALS = list;
    if (grpRes.ok) {
      const gd = await grpRes.json();
      GROUPS = gd.groups || [];
      TAGS = gd.tags || {};
      BOOKMARKS = gd.bookmarks || {};
    }
    renderGroupSel();
    applyGroupFilter();   // 默认"全部"，查询第一个信号
  } catch (e) {
    msg.textContent = '加载信号清单失败：' + e.message;
  }
}

// 全量预热：环形预取清单中所有信号（串行 + 间隔限速防封IP；已预取过的跳过）
// 缓存键用 code|date（与分组过滤无关），切组后无需重复预取
const PREFETCH_INTERVAL = 500;   // 每条预取间隔（毫秒），温和限速
const prefetched = new Set();    // 页面生命周期内已预取的信号（code|date）
let prefetching = false;

async function prefetchAll() {
  if (SIGNALS.length < 2 || prefetching) return;
  prefetching = true;
  try {
    const cur = FILTERED[Number(sel.value)];
    const start = cur ? SIGNALS.findIndex(s => sigKey(s) === sigKey(cur)) : 0;
    for (let step = 1; step < SIGNALS.length; step++) {
      const s = SIGNALS[(start + step) % SIGNALS.length];
      const key = sigKey(s);
      if (prefetched.has(key)) continue;
      await fetch(`/api/kline?code=${s.code}&date=${s.trade_date}`).catch(() => {});
      prefetched.add(key);
      await new Promise(r => setTimeout(r, PREFETCH_INTERVAL));
    }
  } finally {
    prefetching = false;
  }
}

// 序号跳转：输入第 n 个（1 开始），clamp 到 [1, N] 后切换；非法输入回退当前序号
function jumpTo() {
  if (!FILTERED.length) return;
  const pos = document.getElementById('posNum');
  let n = parseInt(pos.value, 10);
  if (isNaN(n)) { pos.value = String(Number(sel.value) + 1); return; }
  n = Math.max(1, Math.min(FILTERED.length, n));
  pos.value = String(n);
  sel.value = String(n - 1);
  query();
}

// 序号框与当前信号同步（查询/切换成功后调用）
function syncPos() {
  document.getElementById('posNum').value = String(Number(sel.value) + 1);
}

async function query() {
  const s = FILTERED[sel.value];
  if (!s) return;
  const btn = document.getElementById('btn');
  msg.textContent = '';
  noteEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '查询中...';
  try {
    const res = await fetch(`/api/kline?code=${s.code}&date=${s.trade_date}`);
    const data = await res.json();
    if (!res.ok) { msg.textContent = data.error || '查询失败'; chart.clear(); return; }
    render(data);
    msg.textContent = `${data.code} 共 ${data.count} 个交易日（${data.dates[0]} ~ ${data.dates[data.count-1]}）`;
    if (data.note) noteEl.textContent = '提示：' + data.note;
    syncPos();       // 序号框跟随当前信号
    if (tagPop.classList.contains('show')) renderTagPop();   // 标记浮层开着时跟随切换信号
    renderBookmarkUI();   // 书签按钮态跟随当前信号（标记/取消）
    prefetchAll();   // 当前图渲染完成后，后台串行预热全部信号数据
  } catch (e) {
    msg.textContent = '请求失败：' + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = '查询';
  }
}

// 展示窗口设置：信号日前 n / 后 n 个交易日（默认 200/20 = 全量展示）
function readViewN() {
  const b = parseInt(document.getElementById('viewBefore').value, 10);
  const a = parseInt(document.getElementById('viewAfter').value, 10);
  return {
    before: (isNaN(b) || b < 0) ? 200 : b,
    after: (isNaN(a) || a < 0) ? 20 : a,
  };
}

// 按设置把展示窗口定位到 信号日前 n ~ 后 n（clamp 到数据范围，修改即时生效无需重新取数）
function applyView() {
  const d = KDATA;
  if (!d) return;
  const { before, after } = readViewN();
  const lo = Math.max(0, d.signal_index - before);
  const hi = Math.min(d.count - 1, d.signal_index + after);
  chart.setOption({
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], startValue: lo, endValue: hi },
      { type: 'slider', xAxisIndex: [0, 1], startValue: lo, endValue: hi },
    ],
  });
}

// 信号日标注竖线（金色 0.77 宽，可开关）：主图金色虚线，同股其它信号日灰色点线（主图/副图共用）
function buildVLines(d) {
  if (!vLineEnabled()) return [];   // 「信号日线」开关关闭时不画竖线
  const mk = (i, color, type, width) => ({
    xAxis: i, label: { show: false }, lineStyle: { color, type, width },
  });
  return [mk(d.signal_index, SIG, 'dashed', 0.77),
    ...(d.other_signals || []).map(i => mk(i, '#c0c4cc', 'dotted', 1))];
}

// 信号日收盘价水平参考线（仅主图）：金色虚线，右端价格标签远离K线防遮挡
function buildHLine(d) {
  const closePrice = d.candle[d.signal_index][1];
  return {
    yAxis: closePrice,
    lineStyle: { color: SIG, type: 'dashed', width: 0.77 },
    label: {
      show: true, position: 'end', formatter: closePrice.toFixed(2),
      color: '#fff', backgroundColor: SIG, padding: [1, 4], borderRadius: 2, fontSize: 11,
    },
  };
}

function hLineEnabled() {
  return document.getElementById('hLineOn').checked;
}

function vLineEnabled() {
  return document.getElementById('vLineOn').checked;
}

// 主图 markLine 数据：竖线 + 开关控制的收盘价水平线
function buildMarkData(d) {
  return hLineEnabled() ? [...buildVLines(d), buildHLine(d)] : buildVLines(d);
}

function render(d) {
  KDATA = d;
  const sig = d.signal_index;

  // 信号日蜡烛金色描边；其余维持红涨绿跌
  const candleData = d.candle.map((arr, i) => i === sig
    ? { value: arr, itemStyle: { borderColor: SIG, borderColor0: SIG, borderWidth: 2 } }
    : arr);

  // 成交量按当日涨跌着色，信号日柱体同步金色高亮
  const volData = d.volumes.map((v, i) => ({
    value: v,
    itemStyle: i === sig
      ? { color: SIG, opacity: .9 }
      : { color: d.candle[i][1] >= d.candle[i][0] ? UP : DOWN, opacity: .85 },
  }));

  chart.setOption({
    animation: false,
    axisPointer: { link: [{ xAxisIndex: 'all' }], label: { backgroundColor: '#555' } },
    // 悬浮框透明空内容：仅保留十字光标与事件驱动固定面板
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      borderWidth: 0, padding: 0, backgroundColor: 'transparent',
      formatter: () => '',
    },
    legend: {
      top: 0,
      textStyle: { color: '#ccc' },
      data: ['K线', ...PLOT_KEYS.map(k => MA_LABEL[k])],
    },
    grid: [
      { left: 60, right: 60, top: 34, height: '58%' },
      { left: 60, right: 60, top: '74%', height: '14%' },
    ],
    xAxis: [
      { type: 'category', data: d.dates, gridIndex: 0, boundaryGap: true,
        axisLine: { lineStyle: { color: '#555' } }, axisLabel: { show: false }, axisTick: { show: false },
        axisPointer: { show: true, label: { show: false } } },
      { type: 'category', data: d.dates, gridIndex: 1, boundaryGap: true,
        axisLine: { lineStyle: { color: '#555' } }, axisLabel: { color: '#aaa' },
        axisPointer: { show: true, label: { show: false } } },
    ],
    yAxis: [
      { scale: true, gridIndex: 0, splitLine: { lineStyle: { color: '#333' } },
        axisLabel: { color: '#aaa' },
        axisPointer: { show: true, label: { show: true } } },
      { gridIndex: 1, axisLabel: { color: '#aaa', formatter: v => fmtVol(v) }, splitLine: { show: false },
        axisPointer: { show: false } },
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
      { type: 'slider', xAxisIndex: [0, 1], top: '93%', height: 18, start: 0, end: 100 },
    ],
    series: [
      {
        name: 'K线', id: 'kline', type: 'candlestick', data: candleData, xAxisIndex: 0, yAxisIndex: 0,
        itemStyle: { color: UP, color0: DOWN, borderColor: UP, borderColor0: DOWN },
        markLine: { symbol: 'none', silent: true, data: buildMarkData(d) },
      },
      ...PLOT_KEYS.map(k => ({
        name: MA_LABEL[k], type: 'line', data: d.ma[k], xAxisIndex: 0, yAxisIndex: 0,
        symbol: 'none', smooth: true,
        lineStyle: { color: MA_STYLE[k].color, width: MA_STYLE[k].width },
        emphasis: { disabled: true },
      })),
      {
        name: '成交量', id: 'vol', type: 'bar', data: volData, xAxisIndex: 1, yAxisIndex: 1,
        markLine: { symbol: 'none', silent: true, data: buildVLines(d) },
      },
    ],
  }, true);

  applyView();   // 按展示窗口设置定位（信号日前 n / 后 n）
  showBar(sig);  // 面板默认显示信号日
}

// 十字光标移动 → 刷新固定面板；移出图表 → 回到信号日
chart.on('updateAxisPointer', function (event) {
  const info = event.axesInfo && event.axesInfo[0];
  if (!info) return;
  showBar(Math.round(info.value));
});
chart.getZr().on('globalout', function () {
  if (KDATA) showBar(KDATA.signal_index);
});

sel.addEventListener('change', query);
// 展示窗口前 n/后 n 修改即时重新定位（不重新取数）
document.getElementById('viewBefore').addEventListener('change', applyView);
document.getElementById('viewAfter').addEventListener('change', applyView);
// 信号日线/收盘价线开关：按 series id 定向更新主图与副图 markLine，不重渲染、不重置缩放
function updateMarkLines() {
  const d = KDATA;
  if (!d) return;
  chart.setOption({
    series: [
      { id: 'kline', markLine: { symbol: 'none', silent: true, data: buildMarkData(d) } },
      { id: 'vol', markLine: { symbol: 'none', silent: true, data: buildVLines(d) } },
    ],
  });
}
document.getElementById('hLineOn').addEventListener('change', updateMarkLines);
document.getElementById('vLineOn').addEventListener('change', updateMarkLines);
// 序号跳转：修改/回车即跳到第 n 个信号
const posNum = document.getElementById('posNum');
posNum.addEventListener('change', jumpTo);
posNum.addEventListener('keydown', e => { if (e.key === 'Enter') jumpTo(); });
document.getElementById('btn').addEventListener('click', query);
// 上一个/下一个：按钮点击与键盘快捷键（q/w）共用，均基于当前分组过滤结果
function prevSignal() {
  if (!FILTERED.length) return;
  sel.value = String((Number(sel.value) - 1 + FILTERED.length) % FILTERED.length);
  query();
}
function nextSignal() {
  if (!FILTERED.length) return;
  sel.value = String((Number(sel.value) + 1) % FILTERED.length);
  query();
}
document.getElementById('prev').addEventListener('click', prevSignal);
document.getElementById('next').addEventListener('click', nextSignal);

// 复制当前信号代码到剪贴板：优先 clipboard API（127.0.0.1 安全上下文免授权），
// 不可用时降级旧式 execCommand，成功后信息区短暂提示
async function copyCode() {
  if (!KDATA) return;
  const code = KDATA.code;
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(code);
      ok = true;
    } else {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }
  } catch (e) {
    ok = false;
  }
  msg.textContent = ok ? `已复制 ${code} 到剪贴板` : '复制失败';
  setTimeout(() => { if (msg.textContent.includes('剪贴板') || msg.textContent === '复制失败') msg.textContent = ''; }, 2000);
}

// 键盘快捷键：q=上一个 w=下一个 c=复制代码；开关关闭或焦点在输入控件时忽略（避免打字误触发）
function hotkeyEnabled() {
  return document.getElementById('hotkeyOn').checked;
}
document.addEventListener('keydown', e => {
  if (!hotkeyEnabled()) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
  if (e.key === 'q' || e.key === 'Q') prevSignal();
  else if (e.key === 'w' || e.key === 'W') nextSignal();
  else if (e.key === 'c' || e.key === 'C') copyCode();
});

// ===================== 分组管理 =====================
// 切换分组：过滤重建信号下拉（当前信号在组内则保持，否则跳组内第一个）
document.getElementById('group').addEventListener('change', e => {
  curGroup = e.target.value;
  renderGroupSel();
  applyGroupFilter();
});

// JSON POST 公共封装
async function postJSON(url, body, method = 'POST') {
  const res = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  return { res, data: await res.json().catch(() => ({})) };
}

// 新建分组（不切换当前视图，新组出现在下拉中数量为 0）
async function createGroup(name) {
  const { res, data } = await postJSON('/api/groups', { name });
  if (!res.ok) { msg.textContent = data.error || '创建分组失败'; return false; }
  if (!GROUPS.includes(name)) GROUPS.push(name);
  renderGroupSel();
  return true;
}

document.getElementById('addGroup').addEventListener('click', async () => {
  const name = (prompt('请输入新分组名称：') || '').trim();
  if (!name) return;
  if (await createGroup(name)) msg.textContent = `已创建分组「${name}」，可在「标记分组」中勾选个股`;
});

// 删除分组：清理该组全部标记；删的是当前选中组则切回"全部"
document.getElementById('delGroup').addEventListener('click', async () => {
  if (curGroup === '全部') return;
  if (!confirm(`确定删除分组「${curGroup}」？该组内所有标记将一并清除。`)) return;
  const name = curGroup;
  const { res, data } = await postJSON('/api/groups', { name }, 'DELETE');
  if (!res.ok) { msg.textContent = data.error || '删除分组失败'; return; }
  GROUPS = GROUPS.filter(g => g !== name);
  for (const k of Object.keys(TAGS)) {
    TAGS[k] = TAGS[k].filter(g => g !== name);
    if (!TAGS[k].length) delete TAGS[k];
  }
  delete BOOKMARKS[name];   // 同步清理该书签（后端已级联删除）
  curGroup = '全部';
  renderGroupSel();
  applyGroupFilter();
  msg.textContent = `已删除分组「${name}」`;
});

// ===================== 标记分组浮层 =====================
const tagBtn = document.getElementById('tagBtn');
const tagPop = document.getElementById('tagPop');

// 渲染浮层：当前信号（code+日期）× 所有分组复选框
function renderTagPop() {
  const s = FILTERED[Number(sel.value)];
  if (!s) return false;
  const marked = TAGS[sigKey(s)] || [];
  document.getElementById('tagPopTitle').textContent = `${s.code}　${s.trade_date}`;
  document.getElementById('tagList').innerHTML = GROUPS.length
    ? GROUPS.map(g => `<label class="tag-item"><input type="checkbox" data-g="${g}"${marked.includes(g) ? ' checked' : ''}> ${g}</label>`).join('')
    : '<div class="tag-empty">暂无分组，请先新建</div>';
  return true;
}

// 保存当前勾选（整体替换该信号的分组归属）
async function saveTags() {
  const s = FILTERED[Number(sel.value)];
  if (!s) return;
  const groups = [...document.querySelectorAll('#tagList input:checked')].map(i => i.dataset.g);
  const { res, data } = await postJSON('/api/tags', { code: s.code, date: s.trade_date, groups });
  if (!res.ok) { msg.textContent = data.error || '保存标记失败'; return; }
  if (groups.length) TAGS[sigKey(s)] = groups; else delete TAGS[sigKey(s)];
  renderGroupSel();   // 分组数量即时刷新
  if (curGroup !== '全部' && !groups.includes(curGroup)) {
    applyGroupFilter();   // 当前信号被移出当前组 → 按定位规则跳转（书签续读）
  } else {
    const cur = Number(sel.value);   // 先存索引：重建下拉会重置选中项
    rebuildSignalOptions();   // 仍在当前视图：仅刷新选项上的分组标签
    sel.value = String(cur);
  }
}

tagBtn.addEventListener('click', () => {
  if (tagPop.classList.contains('show')) { tagPop.classList.remove('show'); return; }
  if (renderTagPop()) tagPop.classList.add('show');
});

// 勾选/取消即时保存（事件委托）
document.getElementById('tagList').addEventListener('change', saveTags);

// 浮层内快捷建组：创建后自动勾选并保存到当前信号
document.getElementById('tagNew').addEventListener('click', async () => {
  const name = (prompt('请输入新分组名称：') || '').trim();
  if (!name) return;
  if (await createGroup(name)) {
    if (renderTagPop()) {
      const cb = document.querySelector(`#tagList input[data-g="${name}"]`);
      if (cb) { cb.checked = true; saveTags(); }
    }
  }
});

// 点击浮层外部关闭
document.addEventListener('click', e => {
  if (!tagPop.classList.contains('show')) return;
  if (tagPop.contains(e.target) || tagBtn.contains(e.target)) return;
  tagPop.classList.remove('show');
});

// ===================== 分组书签 =====================
// 书签=阅读进度，每组一个只前进不后退；按钮无快捷键
const bmBtn = document.getElementById('bmBtn');
const bmGo = document.getElementById('bmGo');
const bmInfo = document.getElementById('bmInfo');

// 书签在当前分组视图中的序号（1 开始；无书签或书签不在组内返回 null）
function bmPos() {
  const key = BOOKMARKS[curGroup];
  if (!key) return null;
  const i = FILTERED.findIndex(s => sigKey(s) === key);
  return i < 0 ? null : i + 1;
}

// 刷新书签按钮态/跳书签可用性/位置小字（当前信号或当前分组变化后调用）
// 按钮两态视觉：标记书签=金实底，取消书签=金描边空心，状态一眼可辨
function renderBookmarkUI() {
  const key = BOOKMARKS[curGroup];
  const cur = FILTERED[Number(sel.value)];
  const isCancel = !!(key && cur && key === sigKey(cur));
  bmBtn.textContent = isCancel ? '取消书签' : '标记书签';
  bmBtn.classList.toggle('btn-gold', !isCancel);
  bmBtn.classList.toggle('btn-gold-ghost', isCancel);
  const pos = bmPos();
  bmGo.disabled = pos == null;
  bmInfo.textContent = pos == null ? '' : `书签 ${pos} ★`;
}

bmBtn.addEventListener('click', async () => {
  const s = FILTERED[Number(sel.value)];
  if (!s) return;
  if (BOOKMARKS[curGroup] === sigKey(s)) {
    const { res, data } = await postJSON('/api/bookmark', { group: curGroup }, 'DELETE');
    if (!res.ok) { msg.textContent = data.error || '取消书签失败'; return; }
    delete BOOKMARKS[curGroup];
    msg.textContent = `已取消分组「${curGroup}」的书签`;
  } else {
    const { res, data } = await postJSON('/api/bookmark', { group: curGroup, code: s.code, date: s.trade_date });
    if (!res.ok) { msg.textContent = data.error || '标记书签失败'; return; }
    BOOKMARKS[curGroup] = data.key;
    msg.textContent = data.kept
      ? `书签保持在第 ${bmPos()} 个（只前进不后退）`
      : `书签已标记至第 ${bmPos()} 个`;
  }
  const cur = Number(sel.value);   // 先存索引：重建下拉会重置选中项
  renderBookmarkUI();
  rebuildSignalOptions();   // ★ 标记跟随刷新
  sel.value = String(cur);
});

// 跳书签：定位书签信号并查询；书签失效（信号已不在清单）时清除
bmGo.addEventListener('click', async () => {
  const pos = bmPos();
  if (pos == null) {
    if (BOOKMARKS[curGroup]) {
      const cur = Number(sel.value);   // 先存索引：重建下拉会重置选中项
      await postJSON('/api/bookmark', { group: curGroup }, 'DELETE');
      delete BOOKMARKS[curGroup];
      renderBookmarkUI();
      rebuildSignalOptions();
      sel.value = String(cur);
      msg.textContent = '书签信号已不在清单中，已清除';
    } else {
      msg.textContent = `分组「${curGroup}」暂无书签`;
    }
    return;
  }
  sel.value = String(pos - 1);
  query();
});

// 页面加载后拉取信号清单+分组并默认查询第一个
loadAll();
</script>
